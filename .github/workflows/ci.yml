name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          go test ./... -coverprofile=coverage.out
          go tool cover -func=coverage.out
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install & run tests (use legacy-peer-deps to avoid CI ERESOLVE)
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx c8 --reporter=text --reporter=lcov npx vitest run
      - name: Debug coverage files (list what's produced)
        working-directory: frontend
        run: |
          echo "pwd: $(pwd)"
          node -v
          npm -v
          echo "--- ls -la ---"
          ls -la
          echo "--- coverage dir ---"
          ls -la coverage || true
          echo "--- find lcov/info files ---"
          find . -maxdepth 4 -type f -name 'lcov*' -o -name '*.info' -print || true
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/**
